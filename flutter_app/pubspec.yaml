name: colorforge
description: ColorForge — colour-fill game (mobile). Paint by number where each region
  reveals the original photo (paint the flat colour, it morphs into the real pixels).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bundle/
    - assets/bundle/swatches/
