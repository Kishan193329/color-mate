# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.enableJetifier=true

# 16KB page size: allow proper alignment of native libs in AAB (AGP 8.5.1+)
android.bundle.enableNativeLibraryCompression=false

# ---------------------------------------------------------------------------
# Which JDK runs Gradle.
#
# Android Studio's bundled JBR updated itself to Java 25, and Gradle 8.13 only
# supports up to Java 23 — hence "Incompatible Gradle JVM version" on sync.
# Pinning a JDK 21 here fixes Studio AND the command line at once, so both use
# the same JVM and builds cannot diverge between them.
#
# NOTE: this path is machine-specific, like local.properties. On another PC set
# it to that machine's JDK 17/21, or delete the line and pick the JDK in
# Studio > Settings > Build Tools > Gradle > Gradle JDK.
# ---------------------------------------------------------------------------
org.gradle.java.home=C:\\Users\\User\\.gradle\\jdks\\eclipse_adoptium-21-amd64-windows.2

# Gradle also SCANS the machine for other JVMs and may pick one itself. It found the JRE that the
# IDE's Red Hat Java extension ships (Java 21.0.11 — newer than the JDK above, so it wins any
# "give me a Java 21" lookup) and then failed on it:
#
#   Cause: jlink executable ...\redhat.java-...\jre\...\bin\jlink.exe does not exist.
#
# That path is a JRE, not a JDK: no jlink, no jmods, no javac. Turning detection off means Gradle
# uses only the JDK pinned above, whichever tool launches the build — IDE settings cannot drift
# into this again. Safe here because nothing in this project requests a Java toolchain.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
