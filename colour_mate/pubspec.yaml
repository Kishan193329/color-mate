name: colour_mate
description: "Colour Mate - AI colour-by-number reveal"
publish_to: 'none'

# Bumped from the live app's versionCode at release time; 1.0.0 while we develop.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking + local storage. Kept deliberately small (owner wants a small APK):
  # no state-management or UI framework packages, just the essentials.
  http: ^1.2.2                # REST calls to the ColorForge backend
  shared_preferences: ^2.3.2  # coins, settings, first-run flag
  path_provider: ^2.1.5       # on-disk cache for downloaded picture packages
  cached_network_image: ^3.4.1 # disk-cached grid thumbnails

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # A bundled sample so the reveal game runs the instant the app opens,
    # before any server is reachable. Same 4-file contract as a server item.
    - assets/sample_reveal/
