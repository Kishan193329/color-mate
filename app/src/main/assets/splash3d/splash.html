<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="color-scheme" content="light" />
<title>ColourMate — splash</title>
<style>
  /* Bundled with the app — the splash must never wait on the network. */
  @font-face { font-family:'CMDisplay'; src:url('quicksand_semibold.ttf') format('truetype'); font-weight:500; font-display:block; }
  @font-face { font-family:'CMDisplay'; src:url('quicksand_semibold.ttf') format('truetype'); font-weight:600; font-display:block; }
  @font-face { font-family:'CMDisplay'; src:url('quicksand_bold.ttf')     format('truetype'); font-weight:700; font-display:block; }
</style>
<style>
  :root{
    --paper:#FFFFFF; --navy:#1F2B45; --violet:#8B5CF6; --violet-soft:#C4B5FD;
    --pink:#F2477F; --orange:#F5A742; --green:#4CAF50; --blue:#2E9BF0;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper);
    display:flex;align-items:center;justify-content:center;font-family:'CMDisplay',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;
  }
  #stage{
    position:relative;background:var(--paper);
    width:100vw;
    height:100vh;
    /*
      The safe-area padding is gone. With box-sizing:border-box it ate into the stage's own fixed
      height, so on a phone with a status-bar inset the artwork was squeezed and pushed down —
      it read as off-centre. The stage is centred by the flex on <body>, and the splash runs
      behind the system bars anyway, so there is nothing to inset around.
    */
    margin:auto;
  }
  svg#art{width:100%;height:100%;display:block}   /* viewBox centres via xMidYMid */

  .bnum{font-family:'CMDisplay',sans-serif;font-size:11.5px;font-weight:600;fill:#1F2B45}
  .snum{font-family:'CMDisplay',sans-serif;font-size:12px;font-weight:600;fill:#FFFFFF}

  .badge{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4);
          transition:opacity .2s ease, transform .3s cubic-bezier(.22,1.5,.4,1)}
  .badge.on{opacity:1;transform:scale(1)}
  .badge.done{opacity:0;transform:scale(1.55)}

  .cg{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.97);
       transition:opacity .3s ease, transform .4s cubic-bezier(.22,1,.36,1)}
  .cg.on{opacity:1;transform:none}

  /* the paint tray: dim until that number has been used */
  .sw{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.5)}
  .sw.in{opacity:.34;transform:scale(1);transition:opacity .3s ease, transform .4s cubic-bezier(.22,1.4,.4,1)}
  .sw.used{opacity:1;transform:scale(1)}
  .sw .ring{stroke-opacity:.25;transition:stroke-opacity .3s ease}
  .sw.used .ring{stroke-opacity:1}

  .deco{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.3)}
  .deco.on{animation:pop .42s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes pop{to{opacity:1;transform:scale(1)}}

  #waves,#pencils{opacity:0;transform:translateY(26px);
                   transition:opacity .6s ease, transform .8s cubic-bezier(.16,1,.3,1)}
  #waves.on,#pencils.on{opacity:1;transform:none}

  #copy{position:absolute;left:0;right:0;bottom:20.5%;text-align:center;pointer-events:none}
  #logo{display:flex;align-items:center;justify-content:center;gap:11px;
         opacity:0;transform:translateY(14px);
         transition:opacity .45s ease, transform .55s cubic-bezier(.22,1,.36,1)}
  #palette{width:clamp(48px,14vw,62px);height:auto;flex:none}
  #name{margin:0;font-size:clamp(31px,9.6vw,42px);font-weight:600;line-height:.94;text-align:left}
  #name .l2{display:block;color:var(--navy)}
  #pill{
    display:inline-block;margin-top:14px;padding:7px 16px 8px;border-radius:999px;
    background:#FFF7E8;border:1.5px dashed #F3C88A;font-size:12.5px;font-weight:600;
    opacity:0;transform:translateY(8px);
    transition:opacity .4s ease .14s, transform .45s ease .14s;
  }
  #pill .a{color:var(--pink)} #pill .b{color:var(--green)} #pill .c{color:var(--blue)}
  #pill .dot{color:var(--orange)}
  #copy.on #logo, #copy.on #pill{opacity:1;transform:none}

  #exit{position:fixed;inset:0;background:var(--paper);z-index:3;opacity:0;
        pointer-events:none;transition:opacity .4s ease}
  #exit.on{opacity:1}
</style>
</head>

<script>
"use strict";
var CONFIG = { loop:false, maxWaitMs:10000 };   /* loop is for previewing in a browser only */

/*
  copy was 5.25 — the wordmark only appeared in the last second. The layout reserves a band for it
  between the paint tray and the pencils, so for the first five seconds that band sat empty and the
  whole splash read as top-heavy and off-centre. Bringing the wordmark in early fills the space it
  was always meant to fill, and puts the brand on screen for the whole splash rather than a blink
  of it at the end.

var T = { inkIn:0.85, tray:1.25, badges:1.55, fillStart:2.10, fillEnd:4.90,

    pBody=document.getElementById('pBody'), copyEl=document.getElementById('copy'),
    exitEl=document.getElementById('exit'),
    waves=document.getElementById('waves'), pencils=document.getElementById('pencils');
var cgs=[].slice.call(document.querySelectorAll('.cg')).sort(function(a,b){return +a.dataset.n-+b.dataset.n;});
var badges={}, sws={};
[].forEach.call(document.querySelectorAll('.badge'),function(b){ badges[b.dataset.n]=b; });
[].forEach.call(document.querySelectorAll('.sw'),   function(s){ sws[s.dataset.n]=s; });
var decos=[].slice.call(document.querySelectorAll('.deco'));

/* clip the line art so it uncovers top to bottom, like a page being revealed */
var ns='http://www.w3.org/2000/svg';
var cp=document.createElementNS(ns,'clipPath'); cp.setAttribute('id','wipe');
var rct=document.createElementNS(ns,'rect');
rct.setAttribute('x',-20); rct.setAttribute('y',-20); rct.setAttribute('width',400); rct.setAttribute('height',0);
cp.appendChild(rct); svg.querySelector('defs').appendChild(cp);

var handedOff=false, timers=[], raf=null;

function tellReady(){

}

function handoff(){
  if (handedOff) return; handedOff=true;
  try{
    if (window.Android && window.Android.onSplashDone) window.Android.onSplashDone();
    else if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage('splash-done');
    else if (window.flutter_inappwebview) window.flutter_inappwebview.callHandler('splashDone');

  if (raf) cancelAnimationFrame(raf);
  timers.forEach(clearTimeout); timers=[];
  handedOff=false;
  rct.setAttribute('height',0);
  cgs.forEach(function(g){ g.classList.remove('on'); });
  Object.keys(badges).forEach(function(k){ badges[k].classList.remove('on','done'); });
  Object.keys(sws).forEach(function(k){ sws[k].classList.remove('in','used'); });
  decos.forEach(function(d){ d.classList.remove('on'); });

      var prev=idx>0?cgs[idx-1]:null;
      var px=prev?+prev.dataset.x:gx, py=prev?+prev.dataset.y:gy+70;
      var e=Math.min(local/0.42,1); e=1-Math.pow(1-e,3);
      pencil.setAttribute('transform','translate('+(px+(gx-px)*e)+' '+(py+(gy-py)*e)+')');

      if (local>0.40 && !g.classList.contains('on')){
        g.classList.add('on');
        var b=badges[g.dataset.n]; if (b) b.classList.add('done');
        var s=sws[g.dataset.n];    if (s) s.classList.add('used');
      }
    }
    if (t>T.fillEnd+0.4) pencil.setAttribute('opacity',0);

    if (!decoed && t>=T.deco){
      decoed=true;
      decos.forEach(function(dd,i){ timers.push(setTimeout(function(){ dd.classList.add('on'); }, i*65)); });
    }
    if (!copied && t>=T.copy){ copied=true; copyEl.classList.add('on'); }
    if (!exited && t>=T.exit){
      exited=true; exitEl.classList.add('on');
      timers.push(setTimeout(function(){
        handoff(); if (CONFIG.loop) timers.push(setTimeout(play,500));
      },400));
      return;
    }
    raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}

function showStatic(){
  rct.setAttribute('height',340);
  cgs.forEach(function(g){ g.classList.add('on'); });
  Object.keys(sws).forEach(function(k){ sws[k].classList.add('in','used'); });
  decos.forEach(function(d){ d.classList.add('on'); });
  waves.classList.add('on'); pencils.classList.add('on'); copyEl.classList.add('on');
  timers.push(setTimeout(function(){
    exitEl.classList.add('on'); timers.push(setTimeout(handoff,400));
  },900));
}

document.getElementById('stage').addEventListener('click', play);
play();
requestAnimationFrame(function(){ requestAnimationFrame(tellReady); });
</script>
