android {
    namespace 'com.colourmate.paintbynumber'
    compileSdk 36
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "com.pixel.art.coloring.color.number.paint"
        minSdk 24
        targetSdk 36
        // 14: Play "Disruptive Ads" fix (2026-10-14) — the strike names versionCode 13.
        versionCode 15
        versionName "15" +
                ".0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

    }

    buildTypes {
        debug {
            minifyEnabled false
            // Google's public sample AdMob app id — correct for development, earns nothing.
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // The owner's real AdMob app id (2026-10-14). An app id is not a secret — it ships
            // in every APK's manifest — so it lives here; -PADMOB_APP_ID / gradle.properties
            // can still override it. The guard below still refuses a missing or TEST id, which
            // is what the manifest carried until 2026-07-22 and made every ad a "Test Ad".
            manifestPlaceholders = [admobAppId: admobAppId()]
        }
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            // Don't pin CMake version - use NDK's bundled CMake/Ninja to avoid
            // "problem occurred starting process" with SDK's ninja.exe on some setups
        }
    }

    packagingOptions {
        jniLibs {
            // Workaround: pre-built libscanner.so/libeditor.so/libpdfium.so have RELRO alignment issues.
            // Excluding x86 (abiFilters) removes that variant. For full fix, rebuild libs with:
            // -Wl,-z,max-page-size=16384 or obtain 16KB-aligned versions from Sumoing/Recolor.
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        viewBinding true
        // AGP 8 does not generate BuildConfig unless asked; the sample buttons use
        // BuildConfig.DEBUG to stay out of release builds.
        buildConfig true
    }

}

// Release AdMob app id: a -P / gradle.properties value wins, else the owner's real id.
def admobAppId() {
    def override = (project.findProperty('ADMOB_APP_ID') ?: '').toString()
    return override ? override : 'ca-app-pub-2992947096890498~7236574023'
}

// Stop a release build the moment it would ship without a real AdMob app id.
tasks.whenTaskAdded { task ->
    if (task.name == 'processReleaseManifest' || task.name == 'processReleaseMainManifest') {
        task.doFirst {
            def id = admobAppId()
            if (!id.startsWith('ca-app-pub-') || id.contains('3940256099942544')) {
                throw new GradleException(
                        'Release build needs a REAL AdMob app id (this one is missing or is ' +
                        'Google\'s test id, which earns nothing). Add ' +
                        'ADMOB_APP_ID=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY to gradle.properties, ' +
                        'or pass -PADMOB_APP_ID=... . Find it in AdMob > App settings > App ID. ' +
                        'Currently: ' + (id ? id : '(not set)'))
            }
        }
    }
}

