<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ColorForge Studio — Admin</title>
<style>
  :root{
    /* Warm neutral ground so the artwork supplies the colour. Three surface steps, not one,
       so a card sits above the page and a control sits above the card. */
    --canvas:#FAF8F4;--surface:#FFFFFF;--surface-2:#F4F1EB;--surface-3:#EAE5DC;
    --ink:#17140F;--muted:#6B6459;--faint:#9A9288;--border:#EAE4DA;--border-strong:#D6CEC1;
    --sidebar:#1A1713;--sidebar-2:#262119;--sidebar-ink:#F2EDE5;--sidebar-muted:#9B9287;--sidebar-border:#2E2820;
    --accent:#5B4BFF;--accent-2:#8A5CF6;--accent-ink:#FFFFFF;--accent-soft:#EDEAFF;--accent-line:#D6D0FF;
    --good:#0E9A62;--good-soft:#E2F5EC;--warn:#B0730A;--warn-soft:#FBF0DA;--bad:#D93F47;--bad-soft:#FCE8E9;
    --premium:#7C4DE0;--premium-soft:#F1EAFD;
    --e1:0 1px 2px rgba(23,20,15,.05);
    --e2:0 2px 4px rgba(23,20,15,.05),0 8px 20px -6px rgba(23,20,15,.10);
    --e3:0 4px 8px rgba(23,20,15,.06),0 24px 48px -12px rgba(23,20,15,.20);
    --edge:inset 0 1px 0 rgba(255,255,255,.7);          /* top highlight = the light source */
    --r-sm:9px;--r:13px;--r-lg:18px;--r-xl:24px;--radius:13px;
    --fs-display:30px;--fs-title:20px;--fs-h:15px;--fs-body:13.5px;--fs-label:12px;--fs-micro:11px;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --canvas:#100E0B;--surface:#1A1713;--surface-2:#221E18;--surface-3:#2C2720;
    --ink:#F5F1EA;--muted:#A69E93;--faint:#726B61;--border:#282320;--border-strong:#39332B;
    --sidebar:#0C0A08;--sidebar-2:#191510;--sidebar-border:#221D17;
    --accent:#8B7DFF;--accent-2:#A98BF0;--accent-ink:#14111F;--accent-soft:#211C3E;--accent-line:#332C63;
    --good:#3ECB86;--good-soft:#0F2C22;--warn:#E0A431;--warn-soft:#2C220F;--bad:#F06A70;--bad-soft:#31191A;
    --premium:#A98BF0;--premium-soft:#231C36;
    --e1:0 1px 2px rgba(0,0,0,.4);
    --e2:0 2px 4px rgba(0,0,0,.35),0 8px 20px -6px rgba(0,0,0,.55);
    --e3:0 4px 8px rgba(0,0,0,.4),0 24px 48px -12px rgba(0,0,0,.7);
    --edge:inset 0 1px 0 rgba(255,255,255,.045);
  }}
  :root[data-theme="light"]{
    /* Warm neutral ground so the artwork supplies the colour. Three surface steps, not one,
       so a card sits above the page and a control sits above the card. */
    --canvas:#FAF8F4;--surface:#FFFFFF;--surface-2:#F4F1EB;--surface-3:#EAE5DC;
    --ink:#17140F;--muted:#6B6459;--faint:#9A9288;--border:#EAE4DA;--border-strong:#D6CEC1;
    --sidebar:#1A1713;--sidebar-2:#262119;--sidebar-ink:#F2EDE5;--sidebar-muted:#9B9287;--sidebar-border:#2E2820;
    --accent:#5B4BFF;--accent-2:#8A5CF6;--accent-ink:#FFFFFF;--accent-soft:#EDEAFF;--accent-line:#D6D0FF;
    --good:#0E9A62;--good-soft:#E2F5EC;--warn:#B0730A;--warn-soft:#FBF0DA;--bad:#D93F47;--bad-soft:#FCE8E9;
    --premium:#7C4DE0;--premium-soft:#F1EAFD;
    --e1:0 1px 2px rgba(23,20,15,.05);
    --e2:0 2px 4px rgba(23,20,15,.05),0 8px 20px -6px rgba(23,20,15,.10);
    --e3:0 4px 8px rgba(23,20,15,.06),0 24px 48px -12px rgba(23,20,15,.20);
    --edge:inset 0 1px 0 rgba(255,255,255,.7);          /* top highlight = the light source */
  }
  :root[data-theme="dark"]{
    --canvas:#100E0B;--surface:#1A1713;--surface-2:#221E18;--surface-3:#2C2720;
    --ink:#F5F1EA;--muted:#A69E93;--faint:#726B61;--border:#282320;--border-strong:#39332B;
    --sidebar:#0C0A08;--sidebar-2:#191510;--sidebar-border:#221D17;
    --accent:#8B7DFF;--accent-2:#A98BF0;--accent-ink:#14111F;--accent-soft:#211C3E;--accent-line:#332C63;
    --good:#3ECB86;--good-soft:#0F2C22;--warn:#E0A431;--warn-soft:#2C220F;--bad:#F06A70;--bad-soft:#31191A;
    --premium:#A98BF0;--premium-soft:#231C36;
    --e1:0 1px 2px rgba(0,0,0,.4);
    --e2:0 2px 4px rgba(0,0,0,.35),0 8px 20px -6px rgba(0,0,0,.55);
    --e3:0 4px 8px rgba(0,0,0,.4),0 24px 48px -12px rgba(0,0,0,.7);
    --edge:inset 0 1px 0 rgba(255,255,255,.045);
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:var(--fs-body);
    line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .tnum{font-variant-numeric:tabular-nums} button{font-family:inherit}
  /* ic() emits a bare <svg> with no width/height — without this base size an icon in an
     unscoped spot stretches to fill its flex line. Every scoped rule below still wins. */
  svg{width:16px;height:16px;flex:none;stroke-width:1.9}

  /* ---- login ---- */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1100px 500px at 50% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent),var(--canvas)}
  .lcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
  .lcard .lg{display:flex;align-items:center;gap:11px;margin-bottom:22px}
  .logo{width:38px;height:38px;border-radius:10px;background:conic-gradient(from 210deg,#FF6B4A,#FFC24B,#3ECF8E,#5B4BFF,#E0474C,#FF6B4A);display:grid;place-items:center;flex:none}
  .logo b{width:12px;height:12px;border-radius:50%;background:var(--surface)}
  .lcard h1{font-size:19px;margin:0;font-weight:750;letter-spacing:-.02em}
  .lcard .sub{font-size:12.5px;color:var(--muted)}
  .lerr{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px;display:none}
  .lerr.on{display:block}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .field label{font-size:12px;font-weight:650;color:var(--muted)}
  .field .hint{font-size:11.5px;line-height:1.45;color:var(--muted);margin-top:-1px}
  .field input,.field select,.field textarea{border:1px solid var(--border);background:var(--canvas);border-radius:9px;padding:10px 12px;color:var(--ink);outline:none;font:inherit;font-size:13.5px}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}

  .app{display:grid;grid-template-columns:250px 1fr;height:100vh;overflow:hidden}
  .side{background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;border-right:1px solid var(--sidebar-border)}
  .brand{display:flex;align-items:center;gap:11px;padding:20px 20px 18px}
  .brand .nm{font-weight:750;font-size:15px;line-height:1.1}.brand .sb{font-size:11px;color:var(--sidebar-muted)}
  .deptsw{display:flex;gap:6px;padding:0 12px 4px}
  .deptsw button{flex:1;border:1px solid var(--sidebar-border);background:var(--sidebar-2);color:var(--sidebar-muted);
    border-radius:10px;padding:9px 6px;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.13s}
  .deptsw button:hover{color:var(--sidebar-ink)}
  .deptsw button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px}
  .nav .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--sidebar-muted);padding:14px 10px 6px;font-weight:650}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--sidebar-muted);text-decoration:none;font-weight:550;font-size:13.5px;cursor:pointer;transition:.13s}
  .nav a svg{width:18px;height:18px;flex:none;stroke-width:1.8}
  .nav a:hover{background:var(--sidebar-2);color:var(--sidebar-ink)}
  .nav a.on{background:var(--sidebar-2);color:#fff}.nav a.on svg{color:var(--accent)}
  .nav a .cnt{margin-left:auto;font-size:11px;background:var(--sidebar-2);padding:1px 7px;border-radius:20px;border:1px solid var(--sidebar-border)}
  .nav a.on .cnt{background:var(--accent);color:#fff;border-color:transparent}
  .side .foot{margin-top:auto;padding:14px;border-top:1px solid var(--sidebar-border);display:flex;align-items:center;gap:10px}
  .side .foot .who{min-width:0;flex:1}.side .foot .n{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side .foot .r{font-size:11px;color:var(--sidebar-muted)}
  .avatar{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}

  .main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .top{display:flex;align-items:center;gap:14px;padding:11px 26px;border-bottom:1px solid var(--border);
    background:color-mix(in srgb,var(--canvas) 82%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
  .top .trail{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
  .top .trail .crumb{color:var(--faint);font-weight:550;white-space:nowrap}
  .top .trail .sep{color:var(--border-strong)}
  .top .trail h1{font-size:13.5px;font-weight:680;margin:0;letter-spacing:-.01em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .grow{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 12px;width:220px;color:var(--muted)}
  .search svg{width:16px;height:16px;flex:none}
  .search input{border:0;background:transparent;outline:none;color:var(--ink);font-size:13px;width:100%}
  .iconbtn{width:37px;height:37px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
  .iconbtn svg{width:18px;height:18px} .iconbtn:hover{color:var(--ink);border-color:var(--border-strong)}
  .content{overflow-y:auto;padding:26px}
  .pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .pagehead .t{font-size:var(--fs-display);font-weight:800;letter-spacing:-.032em;margin:0;line-height:1.1}
  .pagehead .d{color:var(--muted);font-size:var(--fs-body);margin-top:6px;max-width:64ch}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow-sm)}
  .stat .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:13px}
  .stat .ic svg{width:18px;height:18px} .stat .v{font-size:27px;font-weight:780;line-height:1}
  .stat .k{color:var(--muted);font-size:12.5px;margin-top:5px;font-weight:550}
  /* ---- audit timeline ---- */
  .tline{list-style:none;margin:0;padding:0;position:relative}
  .tline::before{content:"";position:absolute;left:5px;top:18px;bottom:18px;width:2px;background:var(--border-strong)}
  .tev{display:flex;gap:14px;padding:11px 0;position:relative}
  .tdot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--surface-3);
    box-shadow:0 0 0 3px var(--surface);position:relative;z-index:1}
  .tdot.p-published{background:var(--good)} .tdot.p-rejected{background:var(--bad)}
  .tdot.p-processing{background:var(--accent)}
  .tbody{min-width:0}
  .tl1{font-size:var(--fs-body);line-height:1.45}
  .tl1 b{font-weight:700}
  .ttar{color:var(--muted)}
  .tl2{font-size:var(--fs-micro);color:var(--faint);margin-top:2px}

  /* ---- dashboard ---- */
  .pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  .pstage{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-lg);padding:16px 16px 14px;cursor:pointer;box-shadow:var(--e1),var(--edge);
    display:flex;flex-direction:column;gap:3px;transition:.16s;font:inherit;color:inherit}
  .pstage:hover{transform:translateY(-2px);box-shadow:var(--e2);border-color:var(--border-strong)}
  .pstage.zero{opacity:.62}
  .pstage .pv{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .pstage .pl{font-size:var(--fs-label);color:var(--muted);font-weight:600}
  .pstage .ptrack{margin-top:9px;height:4px;border-radius:20px;background:var(--surface-3);overflow:hidden;display:block}
  .pstage .ptrack i{display:block;height:100%;border-radius:20px;transition:width .4s cubic-bezier(.2,.7,.3,1)}
  @media(max-width:1080px){.pipe{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){.pipe{grid-template-columns:repeat(2,1fr)}}

  .spark{display:flex;align-items:flex-end;gap:5px;height:112px}
  .sbar{flex:1;height:100%;display:flex;align-items:flex-end;border-radius:5px}
  .sbar:hover{background:var(--surface-2)}
  .sbar i{display:block;width:100%;border-radius:5px 5px 3px 3px;
    background:linear-gradient(180deg,var(--accent-2),var(--accent));transition:height .4s cubic-bezier(.2,.7,.3,1)}
  .sxaxis{display:flex;justify-content:space-between;margin-top:9px;font-size:var(--fs-micro);color:var(--faint)}
  .sxaxis .tnum{color:var(--muted);font-weight:650}

  .kv{display:flex;align-items:baseline;gap:10px;padding:11px 0}
  .kv+.kv{border-top:1px solid var(--border)}
  .kv .kl{font-size:var(--fs-body);color:var(--muted);flex:1}
  .kv .kvv{font-size:19px;font-weight:750;letter-spacing:-.02em}
  .kv .ks{font-size:var(--fs-micro);color:var(--faint)}

  .grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
  .grid2 .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .catrow{display:grid;grid-template-columns:1fr 120px 34px;align-items:center;gap:12px;padding:7px 0}
  .catrow+.catrow{border-top:1px solid var(--border)}
  .catrow .cn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .catrow .cv{font-size:12.5px;color:var(--muted);text-align:right}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    box-shadow:var(--e1),var(--edge)}
  .panel .ph{display:flex;align-items:center;gap:10px;padding:15px 20px 13px;border-bottom:1px solid var(--border)}
  .panel .ph h3{margin:0;font-size:var(--fs-h);font-weight:700;letter-spacing:-.01em}
  .panel .ph .link{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:650;cursor:pointer}
  .panel .pb{padding:8px}
  table{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.07em;
    color:var(--faint);font-weight:700;padding:10px 16px}
  .tbl td{padding:13px 16px;border-top:1px solid var(--border);font-size:var(--fs-body);vertical-align:middle}
  .tbl tbody tr{transition:background .12s}
  .tbl tbody tr:hover td{background:var(--surface-2)}
  .emp{display:flex;align-items:center;gap:10px}.emp .nm{font-weight:650}.emp .role{font-size:11.5px;color:var(--faint)}
  .bar{height:7px;border-radius:20px;background:var(--surface-3);overflow:hidden;display:flex}.bar i{display:block;height:100%}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px 3px 7px;border-radius:20px;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .p-processing,.p-publishing{color:var(--accent);background:var(--accent-soft)}
  .p-review{color:var(--warn);background:var(--warn-soft)} .p-submitted{color:var(--warn);background:var(--warn-soft)}
  .p-published{color:var(--good);background:var(--good-soft)} .p-rejected,.p-error{color:var(--bad);background:var(--bad-soft)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:7px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .tier{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .t-free{color:var(--muted);background:var(--surface-3)}.t-reward{color:var(--warn);background:var(--warn-soft)}.t-premium{color:var(--premium);background:var(--premium-soft)}

  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  /* Two filter DIMENSIONS, visibly separated — status and category used to share one
     undifferentiated row, so they read as one list and could not be combined. */
  .filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;
    position:sticky;top:0;z-index:4;padding:10px 0;
    background:linear-gradient(180deg,var(--canvas) 76%,transparent)}
  .fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface);
    border:1px solid var(--border);border-radius:12px;padding:5px 5px 5px 11px;box-shadow:var(--shadow-sm)}
  .flabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--faint);margin-right:2px}
  .fchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;
    border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;transition:.13s}
  .fchip:hover{background:var(--surface-2);color:var(--ink)}
  .fchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .fchip .n{font-size:11px;font-weight:700;padding:0 5px;border-radius:20px;background:var(--surface-3);color:var(--faint);min-width:18px;text-align:center}
  .fchip.on .n{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);color:var(--accent-ink)}

  /* Empty state — a bare "Nothing here." gave no way forward. */
  .blank{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    padding:56px 24px;text-align:center;border:1px dashed var(--border-strong);border-radius:var(--radius);color:var(--muted)}
  .blank svg{width:30px;height:30px;stroke-width:1.5;color:var(--faint);margin-bottom:6px}
  .blank h4{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
  .blank p{margin:0 0 10px;font-size:13px;max-width:340px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:18px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
    box-shadow:var(--e1),var(--edge);display:flex;flex-direction:column;
    transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--e2);border-color:var(--border-strong)}
  .thumb{aspect-ratio:1/1;position:relative;background:var(--surface-2) center/cover no-repeat;
    background-image:var(--pat);cursor:pointer}
  .thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:44%;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.42));opacity:0;transition:.18s}
  .card:hover .thumb::after{opacity:1}
  /* Second background layer under the photo — visible only while it is missing or loading. */
  .thumb,.minithumb{--pat:repeating-linear-gradient(45deg,var(--surface-2) 0 8px,var(--surface-3) 8px 16px)}
  .thumb .stat-pill{position:absolute;top:10px;left:10px;z-index:1}
  .thumb .spin{position:absolute;inset:0;margin:auto;width:32px;height:32px;border:3px solid #ffffff55;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cbody{padding:12px 14px 13px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:96px}
  .cbody .ct{font-weight:700;font-size:var(--fs-h);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmeta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:var(--fs-micro);
    white-space:nowrap;overflow:hidden}
  .cmeta .cby{color:var(--faint);overflow:hidden;text-overflow:ellipsis}
  .tierbadge{position:absolute;bottom:9px;left:10px;z-index:1}
  .sched{display:flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);border-radius:8px;
    padding:5px 9px;font-size:11.5px;font-weight:650}
  .sched svg{width:13px;height:13px}

  get r(){return localStorage.getItem('cf_r')||''}, set r(v){v?localStorage.setItem('cf_r',v):localStorage.removeItem('cf_r')},
  async call(path,opts={},retry=true){
    const o={...opts,headers:{...(opts.headers||{})}};
    if(API.t)o.headers.Authorization='Bearer '+API.t;
    if(o.body&&!(o.body instanceof FormData)){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body);}

      if(rr.ok){API.t=(await rr.json()).access;return API.call(path,opts,false);}

    }
    if(!res.ok){let m='';try{m=(await res.json()).detail||''}catch(e){} throw new Error(m||('error '+res.status));}
    return res.status===204?null:res.json();

const SLABEL={processing:'Generating…',review:'Ready to check',submitted:'In review',publishing:'Publishing…',published:'Live',rejected:'Rejected',error:'Failed'};

function tierChip(t){return `<span class="tier t-${t}">${t==='reward'?'Reward ad':t[0].toUpperCase()+t.slice(1)}</span>`;}
function toast(m,k){const t=document.createElement('div');t.className='toast'+(k?' '+k:'');
  t.innerHTML=`${ic(k==='good'?'check':k==='bad'?'x':'bell')}<span>${m}</span>`;$('#toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),260);},2800);}
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
let HIT={};
/* The one featured "Hit" picture: the app shows it on top with a countdown and opens it only
   once the countdown ends. Boss picks the picture (must be published) and the unlock moment. */
function hitModal(id){
  const it=ITEMS.find(x=>x.id===id);const isHit=HIT.iid===id;
  const d=new Date(Date.now()+24*3600e3);d.setMinutes(0,0,0);
  const pad=n=>String(n).padStart(2,'0');
  const cur=isHit&&HIT.unlock_ts?new Date(HIT.unlock_ts*1000):d;
  const v=`${cur.getFullYear()}-${pad(cur.getMonth()+1)}-${pad(cur.getDate())}T${pad(cur.getHours())}:${pad(cur.getMinutes())}`;
  $('#modal').innerHTML=`<h3>⭐ Hit image</h3><p><b>${esc(it?it.title:'')}</b> becomes the featured picture in the app — shown on top with a countdown, playable once it unlocks. Only one Hit at a time; setting this replaces the current one.</p>
    <div class="field"><label>Unlocks at (your local time)</label><input type="datetime-local" id="mhit" value="${v}"/></div>
    <div class="macts">${isHit?'<button class="btn danger" id="mclr">Remove Hit</button>':''}<div class="grow"></div><button class="btn" id="mc">Cancel</button><button class="btn pri" id="mo">${isHit?'Update':'Make Hit'}</button></div>`;
  $('#modalScrim').classList.add('on');
  $('#mc').onclick=closeModal;
  const clr=$('#mclr');if(clr)clr.onclick=async()=>{closeModal();try{HIT=await API.call('/api/hit',{method:'PUT',body:{}});toast('Hit image removed','good');go(VIEW);}catch(e){toast(e.message,'bad');}};
  $('#mo').onclick=async()=>{const t=new Date($('#mhit').value).getTime()/1000;if(!t){$('#mhit').style.borderColor='var(--bad)';return;}
    closeModal();try{HIT=await API.call('/api/hit',{method:'PUT',body:{iid:id,unlock_ts:t}});toast('Hit image set','good');go(VIEW);}catch(e){toast(e.message,'bad');}};
}
function confirmModal(o){const d=o.danger;
  // `o.date` adds a go-live date picker. onOk gets (text, date) — existing callers read only
  // the first argument, so they are unaffected.
  $('#modal').innerHTML=`<h3>${o.title}</h3><p>${o.body}</p>${o.input?`<div class="field"><textarea id="mi" placeholder="${o.input}">${o.inputValue||''}</textarea></div>`:''}
    ${o.date?`<div class="field"><label>Go live on</label><input type="date" id="md" value="${o.date.value||today()}" min="${today()}"/>
      <div class="hint">Today = live as soon as it finishes publishing. A future date keeps it hidden in the app until that day.</div></div>`:''}
    <div class="macts"><button class="btn" id="mc">Cancel</button><button class="btn ${d?'danger':'pri'}" id="mo">${o.ok||'Confirm'}</button></div>`;
  $('#modalScrim').classList.add('on');

/* ---------------- data ---------------- */
async function loadData(){
  const jobs=[API.call('/api/items').then(d=>ITEMS=d),API.call('/api/categories').then(d=>CATS=d)];
  if(isBoss())jobs.push(API.call('/api/users').then(d=>USERS=d).catch(()=>USERS=[]));
  jobs.push(API.call('/api/hit').then(d=>HIT=d||{}).catch(()=>HIT={}));
  await Promise.all(jobs);
  const q=ITEMS.filter(i=>inDept(i)&&i.status==='submitted').length;const qn=$('#qn');if(qn)qn.textContent=q;
}
// While something is generating the list has to refresh, but re-running go(VIEW) rebuilt the
// whole screen every 4s: the scroll jumped to the top, filters and the "show more" page were
// re-applied, and every thumbnail was re-requested. Now the poll refetches, and if anything
// actually changed it swaps only the cards whose state moved.
function itemSig(){return ITEMS.map(i=>`${i.id}:${i.status}:${i.regions||''}:${i.error?1:0}`).join('|');}
function schedulePoll(){
  const busy=ITEMS.some(i=>i.status==='processing'||i.status==='publishing');
  if(busy&&!poller)poller=setInterval(pollTick,4000);
  if(!busy&&poller){clearInterval(poller);poller=null;}
}
async function pollTick(){
  if(document.hidden)return;                      // don't poll a tab nobody is looking at
  const before=itemSig(), had=new Set(ITEMS.map(i=>i.id));
  try{await loadData();}catch(e){return;}
  if(itemSig()===before){schedulePoll();return;}   // nothing moved — leave the DOM alone
  const appeared=ITEMS.some(i=>!had.has(i.id))||ITEMS.length!==had.size;
  if(appeared||!$('.cards')){await go(VIEW);return;}   // list membership changed -> full redraw
  let missed=false;
  ITEMS.forEach(i=>{
    const el=$(`.card[data-id="${i.id}"]`);
    if(!el)return;                                 // filtered out of this view — nothing to patch
    const fresh=document.createElement('div');fresh.innerHTML=card(i);
    el.replaceWith(fresh.firstElementChild);
    missed=true;
  });
  if(missed){bindView();}                          // re-attach handlers to the swapped cards
  const dw=$('#drawer');if(CUR&&dw&&dw.classList.contains('on'))openDrawer(CUR);
  schedulePoll();
}

// The ids the current filters actually show — "select all" must never reach past them.
function visibleIds(){return $$('[data-pick]').map(b=>b.dataset.pick);}
function pickedItems(){return [...SEL].map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean);}

async function runBatch(items,fn,verb){
  let ok=0,fail=0;
  for(const it of items){                        // sequential on purpose: generation and
    try{await fn(it);ok++;}catch(e){fail++;}     // publishing are heavy server-side jobs
  }
  SEL.clear();await go(VIEW);
  toast(fail?`${verb} ${ok}, ${fail} failed`:`${verb} ${ok}`,fail?'bad':'good');
}
function doBulkPublish(){
  const items=pickedItems().filter(i=>['review','submitted','rejected'].includes(i.status));
  if(!items.length)return;
  confirmModal({title:`Publish ${items.length} image(s)?`,ok:`Publish ${items.length}`,date:{},
    body:'Each goes live at its current tier. They publish one after another — the cards update as they finish.',
    onOk:(_,dt)=>runBatch(items,it=>API.call(`/api/items/${it.id}/approve`,
      {method:'POST',body:dt?{tier:it.tier,publish_date:dt}:{tier:it.tier}}),'Publishing')});}
function doBulkDelete(){
  const items=pickedItems();if(!items.length)return;
  confirmModal({title:`Delete ${items.length} image(s)?`,danger:true,ok:`Delete ${items.length}`,
    body:'Their generated assets are removed too. This cannot be undone.',
    onOk:()=>runBatch(items,it=>API.call('/api/items/'+it.id,{method:'DELETE'}),'Deleted')});}

let thumbObs=null;
function lazyThumbs(){
  const els=$$('[data-thumb]');
  if(!els.length)return;
  const show=el=>{el.style.backgroundImage=`url('${el.dataset.thumb}'),var(--pat)`;el.removeAttribute('data-thumb');};
  // Load what is already on screen immediately — waiting for the observer's first callback
  // leaves the visible cards blank for a beat, and in some environments it never fires at all.
  const near=el=>{const r=el.getBoundingClientRect();return r.top<innerHeight+400&&r.bottom>-400;};
  els.filter(near).forEach(show);
  const rest=$$('[data-thumb]');
  if(!rest.length)return;
  if(!('IntersectionObserver' in window)){rest.forEach(show);return;}
  if(thumbObs)thumbObs.disconnect();
  thumbObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){show(e.target);thumbObs.unobserve(e.target);}}),
    {rootMargin:'400px'});                                  // start a screen early — no blank cards
  rest.forEach(el=>thumbObs.observe(el));
}
function schedNote(i){
  // publish_ts in the future = the app filters it out until that day (Manager.java:417-424),
  // so a "Live" pill alone would be misleading.
  if(i.status!=='published'||!i.publish_ts)return '';
  const d=new Date(i.publish_ts*1000);
  if(d.getTime()<=Date.now())return '';
  return `<div class="sched">${ic('clock')}Goes live ${d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}</div>`;
}
// The pipeline replaces four unrelated stat boxes. Content moves left to right through exactly
// these stages, so showing them in order — with the bar underneath sized by share — says where the
// work is piling up, which four separate numbers never did.
function ago(d){
  const sec=(Date.now()-d.getTime())/1000;
  if(sec<60)return 'just now';
  const m=[[31536000,'year'],[2592000,'month'],[86400,'day'],[3600,'hour'],[60,'minute']];
  for(const [n,l] of m){ if(sec>=n){ const v=Math.floor(sec/n); return `${v} ${l}${v>1?'s':''} ago`; } }
  return 'just now';
}
function pipeline(L){
  const S=[{k:'processing',l:'Generating',c:'var(--accent)'},
           {k:'review',    l:'Ready to check',c:'var(--warn)'},
           {k:'submitted', l:'Awaiting you', c:'var(--warn)'},
           {k:'published', l:'Live in app',  c:'var(--good)'},
           {k:'error',     l:'Failed',       c:'var(--bad)'}];
  const n=k=>L.filter(i=>i.status===k).length;
  const tot=Math.max(1,L.length);
  return `<div class="pipe">${S.map(x=>{const v=n(x.k);return `
    <button class="pstage${v?'':' zero'}" data-f="${SLABEL[x.k]}" data-v="library" title="Show ${x.l}">
      <span class="pv tnum" style="color:${v?x.c:'var(--faint)'}">${v}</span>
      <span class="pl">${x.l}</span>
      <span class="ptrack"><i style="width:${Math.round(v/tot*100)}%;background:${x.c}"></i></span>
    </button>`;}).join('')}</div>`;
}

// Uploads per day for the last fortnight, drawn from data already loaded — no extra request.
function sparkChart(L){
  const DAY=86400000, today=new Date(); today.setHours(0,0,0,0);
  const days=[...Array(14)].map((_,i)=>new Date(today-(13-i)*DAY));
  const counts=days.map(d=>L.filter(i=>{const t=new Date((i.created||0)*1000);t.setHours(0,0,0,0);
    return t.getTime()===d.getTime();}).length);
  const peak=Math.max(1,...counts);
  if(!L.length)return '<div class="empty">Nothing uploaded yet</div>';
  return `<div class="spark">${counts.map((v,i)=>`
    <div class="sbar" title="${days[i].toLocaleDateString(undefined,{day:'numeric',month:'short'})} — ${v} upload(s)">
      <i style="height:${v?Math.max(6,Math.round(v/peak*100)):2}%;${v?'':'opacity:.35'}"></i>
    </div>`).join('')}</div>
    <div class="sxaxis"><span>${days[0].toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span>
      <span class="tnum">${counts.reduce((a,b)=>a+b,0)} in 14 days</span>
      <span>Today</span></div>`;
}

function card(i){
  const busy=i.status==='processing'||i.status==='publishing';
  return `<div class="card ${SEL.has(i.id)?'picked':''}" data-id="${i.id}">

        ${isBoss()&&i.uploader_name?`<span class="cby">${esc(i.uploader_name)}</span>`:''}</div>

function cardActions(i){
  const open=`<button class="btn sm" data-open="${i.id}">Open</button>`;
  if(i.status==='processing')return `<span style="font-size:12px;color:var(--muted)">Generating…</span>`;
  if(i.status==='publishing')return `<span style="font-size:12px;color:var(--muted)">Publishing…</span>`;
  // a failed item is only ever retried or removed — Open still works, it shows the reason
  if(i.status==='error')return open+`<button class="btn sm pri" data-retry="${i.id}">${ic('refresh')}Try again</button><button class="btn sm ghost" data-del="${i.id}" title="Delete" aria-label="Delete">${ic('trash')}</button>`;
  if(isBoss()){
    if(i.status==='submitted')return open+`<button class="btn sm good" data-approve="${i.id}">Approve</button><button class="btn sm bad" data-reject="${i.id}">Reject</button>`;
    // the owner uploads straight to 'review' — let them publish it without a submit-to-self step
    if(i.status==='review'||i.status==='rejected')return open+`<button class="btn sm good" data-approve="${i.id}">Publish</button><button class="btn sm ghost" data-del="${i.id}" title="Delete" aria-label="Delete">${ic('trash')}</button>`;
    return open+(i.status==='published'
      ?`<button class="btn sm ghost" data-sched="${i.id}" title="Change go-live date" aria-label="Change go-live date">${ic('clock')}</button>`
      :`<button class="btn sm ghost" data-del="${i.id}" title="Delete">${ic('trash')}</button>`);
  }
  if(i.status==='review'||i.status==='rejected')return open+`<button class="btn sm pri" data-submit="${i.id}">Submit</button><button class="btn sm ghost" data-del="${i.id}" title="Delete" aria-label="Delete">${ic('trash')}</button>`;
  return open;
}

// Bulk bar — publishing or deleting a batch one card at a time was the slowest thing in here.
function bulkBar(list){
  const ids=list.map(i=>i.id), picked=ids.filter(id=>SEL.has(id));
  const pub=picked.map(id=>ITEMS.find(i=>i.id===id)).filter(i=>i&&['review','submitted','rejected'].includes(i.status));
  const svg=picked.map(id=>ITEMS.find(i=>i.id===id)).filter(i=>i&&i.source_kind==='svg');
  return `<div class="bulk ${picked.length?'on':''}">
    <label class="bchk"><input type="checkbox" id="selAll" ${picked.length&&picked.length===ids.length?'checked':''}/>
      <span>${picked.length?`${picked.length} selected`:'Select all'}</span></label>
    ${picked.length?`<div class="grow"></div>
      ${pub.length?`<button class="btn sm good" id="bulkPub">${ic('check')}Publish ${pub.length}</button>`:''}
      ${picked.length>1?`<button class="btn sm" id="bulkDaily">${ic('clock')}Daily schedule ${picked.length}</button>`:''}
      ${svg.length&&isBoss()?`<button class="btn sm" data-bulkout="black">Black outline ${svg.length}</button><button class="btn sm" data-bulkout="soft">Soft outline ${svg.length}</button>`:''}
      <button class="btn sm bad" id="bulkDel">${ic('trash')}Delete ${picked.length}</button>

const TITLES={dashboard:['Overview','Dashboard'],queue:['Overview','Review queue'],library:['Content','Library'],
  upload:['My work','Upload'],employees:['Team','Employees'],audit:['Security','Audit log'],
  ads:['Monetisation','Ads'],settings:['Settings','Settings'],legacy:['Content','By Number (old)'],pixel:['Content','Pixel'],book:['Content','Colour Book']};
async function go(v){
  VIEW=v;const t=TITLES[v]||['',v];$('#crumb').textContent=t[0];$('#ptitle').textContent=t[1];
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));

  let html='';
  if(v==='dashboard')html=vDashboard();
  else if(v==='library'||v==='queue')html=vLibrary();
  else if(v==='upload')html=vUpload();
  else if(v==='employees')html=vEmployees();
  else if(v==='audit')html=await vAudit();
  else if(v==='ads')html=await vAds();
  else if(v==='legacy')html=await vLegacy();
  else if(v==='pixel')html=await vPixel();
  else if(v==='book')html=await vBook();
  else if(v==='settings')html=await vSettings();
  $('#content').innerHTML=html;bindView();schedulePoll();
}

async function act(id,path,body){try{await API.call(`/api/items/${id}/${path}`,{method:'POST',body:body||{}});await go(VIEW);return true;}
  catch(e){toast(e.message,'bad');return false;}}
async function doApprove(id){const it=ITEMS.find(i=>i.id===id)||{};
  confirmModal({title:'Approve & publish?',ok:'Approve & publish',date:{},
    body:`“${it.title}” goes live in the app as <b>${it.tier}</b>. You can change the tier in the review panel first.`,
    onOk:async(_,dt)=>{const b={tier:it.tier};if(dt)b.publish_date=dt;
      if(await act(id,'approve',b))toast(dt&&dt>today()?`Scheduled for ${dt}`:'Approved — publishing…','good');}});}
// Change the go-live date of something already published — the app hides a future-dated item
// until that day (client-side, Manager.java), so this is real scheduling, not a label.
async function doSchedule(id){const it=ITEMS.find(i=>i.id===id)||{};
  const cur=it.publish_ts?new Date(it.publish_ts*1000).toISOString().slice(0,10):today();
  confirmModal({title:'Change go-live date',ok:'Save date',date:{value:cur},
    body:`“${it.title}” — the app shows it from this date onwards.`,
    onOk:async(_,dt)=>{if(!dt)return;if(await act(id,'publish',{publish_date:dt}))toast(`Go-live set to ${dt}`,'good');}});}
/* One picture per day. The selection becomes a run of go-live dates — first picked item on the
   chosen date, the next a day later, and so on, in the order they appear in the grid. The app
   hides a future-dated item until its day (Manager.java, §3.4), so this fills the "new picture
   every day" pipeline in one action instead of opening seven date pickers.
   Published items get the cheap date-only route; anything still in review is published WITH its
   date. Sequential on purpose — publishing is a heavy server job (§8.5av). */
async function doBulkDaily(){
  const ids=visibleIds().filter(id=>SEL.has(id));
  if(ids.length<2)return;
  const good=ids.map(id=>ITEMS.find(i=>i.id===id))
    .filter(i=>i&&['published','review','submitted','rejected'].includes(i.status));
  if(!good.length){toast('Nothing schedulable selected','bad');return;}
  confirmModal({title:`Daily schedule — ${good.length} pictures`,ok:'Schedule',date:{value:today()},
    input:'Pictures per day (e.g. 50)',inputValue:'50',
    body:`Starting on the date below, this many pictures go live each day, in the order they appear
      in the grid, until all are scheduled. The app keeps each hidden until its day.`,
    onOk:async(per,dt)=>{
      per=Math.max(1,parseInt(per,10)||1);
      if(!dt)return;
      let ok=0,fail=0,n=0,day=new Date(dt+'T00:00:00');
      for(const it of good){
        if(n&&n%per===0)day.setDate(day.getDate()+1);
        n++;
        const d=day.toISOString().slice(0,10);
        try{
          if(it.status==='published')
            await API.call('/api/items/'+it.id+'/schedule',{method:'POST',body:{publish_date:d}});
          else
            await API.call('/api/items/'+it.id+'/publish',{method:'POST',body:{publish_date:d}});
          ok++;
        }catch(e){fail++;}
      }
      SEL.clear();
      toast(`Scheduled ${ok} picture${ok===1?'':'s'}, ${per} per day from ${dt}`+(fail?` — ${fail} failed`:''),fail?'bad':'good');
      go(VIEW);}});}
async function doBulkOutline(style){
  const ids=visibleIds().filter(id=>SEL.has(id)&&(ITEMS.find(i=>i.id===id)||{}).source_kind==='svg');
  let ok=0,fail=0;
  for(const id of ids){try{await API.call(`/api/items/${id}/outline`,{method:'PUT',body:{style}});ok++;}catch(e){fail++;}}
  SEL.clear();await loadData();
  toast(`${style==='soft'?'Soft grey':'Black'} outline set on ${ok}`+(fail?` — ${fail} failed`:'')+' (published ones are re-publishing)',fail?'bad':'good');
  go(VIEW);}
async function doReject(id){confirmModal({title:'Reject image',danger:true,ok:'Reject',input:'What should the artist fix?',
  body:'The artist sees this note and can fix and resubmit.',
  onOk:async r=>{if(await act(id,'reject',{reason:r}))toast('Rejected — artist notified','bad');}});}
async function doDelete(id){confirmModal({title:'Delete image?',danger:true,ok:'Delete',
  body:'The image and its generated assets are removed. This cannot be undone.',
  onOk:async()=>{try{await API.call('/api/items/'+id,{method:'DELETE'});toast('Deleted','bad');closeDrawer();go(VIEW);}catch(e){toast(e.message,'bad');}}});}

async function upload(files){
  const imgs=[...files].filter(f=>f.type.startsWith('image/'));if(!imgs.length)return;
  const sel=$('#upCat');let cat=sel?sel.value:'';
  if(cat==='__new')cat=($('#upNewCat').value||'').trim();
  const simp=$('#upSimp')?$('#upSimp').value:'';
  const out=$('#upStatus');
  for(let n=0;n<imgs.length;n++){const f=imgs[n];
    if(out)out.textContent=`Uploading ${n+1}/${imgs.length}: ${f.name}…`;
    const fd=new FormData();fd.append('file',f);fd.append('title',f.name.replace(/\.[^.]+$/,''));fd.append('category',cat);
    fd.append('type',DEPT);
    if(DEPT==='diamond'){fd.append('mode',$('#upMode')?$('#upMode').value:'auto');
      fd.append('cols',$('#upCols')?$('#upCols').value:78);fd.append('colours',$('#upK')?$('#upK').value:32);}
    else{fd.append('simplify',simp);fd.append('vectorize',$('#upVec')?$('#upVec').value:'');fd.append('outline',$('#upOut')?$('#upOut').value:'');}
    try{await API.call('/api/items',{method:'POST',body:fd});}catch(e){toast('Upload failed: '+e.message,'bad');}
  }
  if(out)out.textContent='';
  toast(`${imgs.length} image(s) uploading — generating in background`,'good');
  go('library');
}

async function addEmployee(){
  const n=$('#nuName').value.trim(),e=$('#nuEmail').value.trim(),r=$('#nuRole').value;
  if(!n||!e){toast('Name and email are required','bad');return;}
  try{const d=await API.call('/api/users',{method:'POST',body:{name:n,email:e,role:r}});
    $('#nuOut').innerHTML=`<div style="background:var(--good-soft);color:var(--good);padding:11px 13px;border-radius:10px;font-size:13px;font-weight:600">
      Account created. Temporary password:<br/><span class="mono" style="font-size:14px">${d.tempPassword}</span><br/>
      <span style="font-weight:500">Share it with ${n} — they sign in with ${e}.</span></div>`;
    $('#nuName').value='';$('#nuEmail').value='';toast('Employee added','good');await loadData();
  }catch(err){toast(err.message,'bad');}}

/* ---------------- review drawer ---------------- */
function flagsFor(i){
  const f=[],dia=(i.type||'colour')==='diamond';
  if(!i.regions)f.push([false,'Not generated yet']);
  else if(dia){
    f.push([true,`${i.regions.toLocaleString()} diamonds in the grid`]);
    f.push([i.colours<=50,`${i.colours} colours — ${i.colours>50?'a lot to sort by hand':'comfortable'}`]);
    f.push([true,'Every cell is exactly one colour']);
  }else{
    f.push([i.regions>60&&i.regions<300,`${i.regions} regions — ${i.regions<60?'few, may be too simple':i.regions>=300?'very dense':'good density'}`]);
    f.push([i.colours<=100,`${i.colours} palette colours`]);
    f.push([true,'One tap fills exactly one region (id-map based)']);
  }
  return f.map(x=>`<div class="flag ${x[0]?'ok':'warn'}"><div class="fb">${ic(x[0]?'check':'alert')}</div><div>${x[1]}</div></div>`).join('');}

async function openDrawer(id){
  const i=ITEMS.find(x=>x.id===id);if(!i)return;CUR=id;
  $('#dwTitle').textContent=i.title;
  $('#dwStatus').className='pill p-'+i.status;$('#dwStatus').textContent=SLABEL[i.status]||i.status;
  $('#dwImg').style.backgroundImage=`url('/api/items/${id}/thumb')`;
  const isDia=(i.type||'colour')==='diamond';
  const failed=i.status==='error';
  const ready=!['processing','publishing','error'].includes(i.status);
  const op=$('#dwOpen');
  op.style.display=ready?'':'none';
  op.href='/review/'+id;
  op.innerHTML=(isDia?'💎 Play the diamond preview':'▶ Open playable preview');
  // A failure gets its own panel in the side column; the thin yellow note is for the
  // in-progress states only, where there is nothing to explain beyond "wait".
  const note=$('#dwNote');
  if(note){note.style.display=(ready||failed)?'none':'';note.textContent=
    i.status==='publishing'?'Publishing to storage…'
    :'Still generating — the preview appears when it is ready.';}
  $('#dwImg').classList.toggle('failed',failed);
  $('#dwLock').style.display=failed?'none':'';       // nothing was generated to protect
  $('#dwErr').style.display=(failed||i.error)?'':'none';
  if(failed)$('#dwErr').innerHTML=errorPanel(i,isDia);
  else if(i.error)$('#dwErr').innerHTML=`<div class="errbox"><div class="ei">${ic('alert')}</div><div><h4>Worth a look before publishing</h4><p>${esc(i.error)}</p></div></div>`;
  $('#dwQualityWrap').style.display=failed?'none':'';
  /* Figma-SVG pictures come in two looks: black outlines or soft grey ones, both over a light grey
     sketch of the real colours. Some pictures read better one way, some the other — the boss
     picks here, and the pick is what the app receives (a published picture is re-exported). */
  const isSvg=i.source_kind==='svg'&&!failed&&ready;
  $('#dwOutWrap').style.display=isSvg?'':'none';
  if(isSvg){const cur=i.outline||'black';
    $('#dwOutLbl').textContent=isBoss()?'Outline — pick the look that goes to the app':'Outline — the boss picks the look';
    $('#dwOut').innerHTML=[['black','Black outline'],['soft','Soft grey outline']].map(([k,l])=>
      `<button data-out="${k}" class="${cur===k?'on':''}" ${isBoss()?'':'disabled'}><img alt="" loading="lazy" src="/api/items/${id}/outline/${k}.jpg"><span>${cur===k?'✓ ':''}${l}</span></button>`).join('');
    if(isBoss())$$('#dwOut button').forEach(b=>b.onclick=async()=>{
      if(b.classList.contains('on'))return;
      try{await API.call(`/api/items/${id}/outline`,{method:'PUT',body:{style:b.dataset.out}});
        await loadData();openDrawer(id);
        toast(i.status==='published'?'Saved — re-publishing so the app gets the new look':'Saved — used when you publish','good');
      }catch(e){toast('Could not save: '+e.message,'bad');}});}
  /* The Detail level matters more than anything in the renderer: the model inks whatever texture
     it can see, so a flat cartoon comes out at 8% ink and a textured photo at 27%. The backend
     measures which the upload is (source_kind) — say so here, next to the control that fixes it.
     It is advice only; picking the level automatically wiped a cartoon's outlines once (§8.5as). */
  $('#dwRegLbl').textContent=failed
    ?(isDia?'Rebuild at a different grid size':'Or try a different Simplify level')
    :(isDia?'Too much detail? Rebuild the line art — no re-upload'
      :i.source_kind==='textured'?'Lots of texture in this picture — if the lines look busy, rebuild it as Photograph'
      :i.source_kind==='flat'?'Flat artwork — Cartoon is the right setting for this one'
      :'Too much detail? Rebuild the line art — no re-upload');
  $('#dwReg').innerHTML=isDia
    ? [50,60,78,100,120].map(c=>`<button data-cols="${c}">${c} wide</button>`).join('')
    : [['light','Cartoon'],['medium','Detailed'],['strong','Photograph'],['','Off']].map(x=>`<button data-l="${x[0]}">${x[1]}</button>`).join('');
  bindRegen();
  $('#dwFlags').innerHTML=flagsFor(i);
  $('#dwTierWrap').style.display=(isBoss()&&!failed)?'':'none';   // nothing to price yet
  $$('#dwTier button').forEach(b=>b.classList.toggle('on',b.dataset.t===i.tier));
  $('#dwAct').innerHTML=drawerActions(i);
  bindDrawerActions();
  try{const cm=await API.call(`/api/items/${id}/comments`);
    $('#dwComments').innerHTML=cm.map(c=>`<div class="cmt"><div class="avatar" style="width:26px;height:26px;font-size:10px;background:var(--accent)">${initials(c.uname)}</div>
      <div class="cb"><div class="cn">${c.uname||'—'}<span>${new Date(c.created*1000).toLocaleString()}</span></div>${c.text}</div></div>`).join('')
      ||'<div style="color:var(--faint);font-size:12.5px">No comments yet.</div>';}catch(e){}
  $('#scrim').classList.add('on');$('#drawer').classList.add('on');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* The failure card. `error` is whatever the engine actually raised (app.py:_fail) — printing it
   verbatim is the whole point: a generic "it failed" costs an hour of guessing. */
function errorPanel(i,isDia){
  const msg=(i.error||'').trim();
  return `<div class="errbox"><div class="ei">${ic('alert')}</div><div>
    <h4>${isDia?'Bead grid':'Colour-fill'} generation failed</h4>
    <p>${msg?'The engine stopped with:':'No reason was recorded — this item failed before the engine could report one. The server console has the traceback.'}</p>
    ${msg?`<code>${esc(msg)}</code>`:''}
    <p>Your upload is safe on the server. Fix the cause, then <b>Try again</b> — there is no need to re-upload the picture.</p>
  </div></div>`;}

function drawerActions(i){
  if(i.status==='error')return `<button class="btn ghost" data-ddel>${ic('trash')}Delete</button><div class="grow"></div><button class="btn pri" data-dretry>${ic('refresh')}Try again</button>`;
  if(isBoss()&&i.status==='submitted')return `<button class="btn bad" data-dreject>${ic('x')}Reject with reason</button><div class="grow"></div><button class="btn good" data-dapprove>${ic('check')}Approve &amp; publish</button>`;
  // owner on their own freshly-generated (review) or rejected image: publish it directly
  if(isBoss()&&(i.status==='review'||i.status==='rejected'))return `<button class="btn ghost" data-ddel>${ic('trash')}Delete</button><div class="grow"></div><button class="btn good" data-dapprove>${ic('check')}Approve &amp; publish</button>`;
  if(!isBoss()&&(i.status==='review'||i.status==='rejected'))return `<button class="btn ghost" data-ddel>${ic('trash')}Delete</button><div class="grow"></div><button class="btn pri" data-dsubmit>${ic('check')}Submit for approval</button>`;
  if(isBoss()&&i.status==='published'&&(i.type||'colour')!=='diamond')return `<div class="grow"></div><button class="btn ${HIT.iid===i.id?'good':'ghost'}" data-dhit>⭐ ${HIT.iid===i.id?'Hit image — edit':'Make Hit image'}</button>`;
  return `<div class="grow"></div><span style="font-size:12.5px;color:var(--muted);align-self:center">${SLABEL[i.status]||i.status}</span>`;
}
function bindDrawerActions(){
  const a=$('[data-dapprove]');if(a)a.onclick=()=>doApprove(CUR);
  const r=$('[data-dreject]');if(r)r.onclick=()=>doReject(CUR);
  const s=$('[data-dsubmit]');if(s)s.onclick=async()=>{if(await act(CUR,'submit')){toast('Submitted for approval','good');closeDrawer();}};
  const d=$('[data-ddel]');if(d)d.onclick=()=>doDelete(CUR);
  const rt=$('[data-dretry]');if(rt)rt.onclick=()=>doRetry(CUR);
  const hb=$('[data-dhit]');if(hb)hb.onclick=()=>hitModal(CUR);
}
/* Retry = regenerate at the item's default settings. The upload is untouched, so this is the
   same path the Regenerate bar uses — just without asking the user to pick a level first. */
async function doRetry(id){
  const i=ITEMS.find(x=>x.id===id);
  const body=(i&&(i.type||'colour')==='diamond')?{mode:'auto'}:{simplify:''};
  try{await API.call('/api/items/'+id+'/regenerate',{method:'POST',body});
    toast('Generating again…','good');closeDrawer();go(VIEW);}catch(e){toast(e.message,'bad');}
}
function bindRegen(){
  $$('#dwReg button').forEach(b=>b.onclick=async()=>{
    const body=b.dataset.cols?{mode:'flat',cols:+b.dataset.cols}:{simplify:b.dataset.l};
    try{await API.call('/api/items/'+CUR+'/regenerate',{method:'POST',body});
      toast(b.dataset.cols?`Rebuilding at ${b.dataset.cols} beads wide…`:'Regenerating…','good');
      closeDrawer();go(VIEW);}catch(e){toast(e.message,'bad');}});
}
function closeDrawer(){$('#scrim').classList.remove('on');$('#drawer').classList.remove('on');}

/* ---------------- app boot ---------------- */
function wire(){
  $('#dwClose').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;
  $('#modalScrim').onclick=e=>{if(e.target.id==='modalScrim')closeModal();};
  $('#reloadBtn').onclick=()=>go(VIEW);
  $$('#deptsw button').forEach(b=>b.onclick=()=>{DEPT=b.dataset.d;localStorage.setItem('cf_dept',DEPT);startApp();});
  const tb=$('#themeBtn');const cur=()=>document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  tb.innerHTML=ic(cur()==='dark'?'sun':'moon');
  tb.onclick=()=>{const t=cur()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);
    tb.innerHTML=ic(t==='dark'?'sun':'moon');const lbl=`Switch to ${t==='dark'?'light':'dark'} theme`;
    tb.title=lbl;tb.setAttribute('aria-label',lbl);};
  $('#sq').addEventListener('input',e=>{SEARCH=e.target.value.trim();if(VIEW!=='library'&&VIEW!=='queue')go('library');else go(VIEW);});
  $$('#dwTier button').forEach(b=>b.onclick=async()=>{$$('#dwTier button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    try{await API.call('/api/items/'+CUR,{method:'PATCH',body:{tier:b.dataset.t}});const it=ITEMS.find(i=>i.id===CUR);if(it)it.tier=b.dataset.t;toast('Tier: '+b.dataset.t,'good');}catch(e){toast(e.message,'bad');}});

  $('#dwCmtBtn').onclick=async()=>{const t=$('#dwCmt').value.trim();if(!t)return;
    try{await API.call('/api/items/'+CUR+'/comments',{method:'POST',body:{text:t}});$('#dwCmt').value='';openDrawer(CUR);}catch(e){toast(e.message,'bad');}};
  $('#dwCmt').addEventListener('keydown',e=>{if(e.key==='Enter')$('#dwCmtBtn').click();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();}});
}
function startApp(){$('#root').innerHTML=shell();wire();go('dashboard');}
(async function boot(){
  if(API.t){try{ME=await API.call('/api/me');return startApp();}catch(e){}}
  renderLogin();
})();
</script></body></html>
